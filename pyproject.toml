[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.2.0"
description = "Generate Codex-oriented harness bundles from structured briefs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
]

[project.scripts]
meta-harness = "meta_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
